#
# Welcome to Jekyll!
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
locale                   : "en-GB"
title                    : "Dr. Lorenz Gärtner"
title_separator          : "|"
subtitle                 :
name                     : &name "Dr. Lorenz Gärtner" # &name is a YAML anchor which can be *referenced later
description              : &description "The personal web page of Lorenz Gärtner, a theoretical and computational physicist."
url                      : "https://lorenzgaertner.com" # base hostname & protocol; used for canonical/OG URLs and sitemap.xml
baseurl                  : # the subpath of your site, e.g. "/blog"
repository               : "lorenzennio/lorenzgaertner"
teaser                   : # path of fallback teaser image, e.g. "/assets/images/500x300.png"
logo                     : /assets/images/plogol2-white.png # path of logo image to display in the masthead, e.g. "/assets/images/88x88.png"
masthead_title           : # overrides the website title displayed in the masthead, use " " for no title
breadcrumbs              : false # true, false (default)
words_per_minute         : 200
atom_feed:
  path                   : # blank (default) uses feed.xml
  hide                   : true # removes the "Feed" link from the footer

# SEO Related
google_site_verification :  # Replace this with your ID, or delete
bing_site_verification   :
naver_site_verification  :
yandex_site_verification :
baidu_site_verification  :

# Social Sharing
twitter:
  username               : &twitter "lorenzennio"
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : "/assets/images/plogol2.png" # Open Graph/Twitter default site image
social:
  type                   : # Person or Organization (defaults to Person)
  name                   : # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles
    - "https://www.linkedin.com/in/lorenz-gaertner/"
    - "https://twitter.com/lorenzennio"
    - "https://github.com/lorenzennio"

# Analytics
analytics:
  provider               : false # false (default), "google", "google-universal", "google-gtag", "custom"


# Site Author
author:
  name             : *name # *name is a YAML reference pointing to the &anchor earlier
  avatar           : "/assets/images/port-900.jpg" # 900x1200 derivative of port.jpg
  bio              : "**Physicist** working on high energy physics, machine learning, emerging tech. Experience in energy and policy."
  location         : "Munich, Germany"
  links:
    - label: "Mail"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:lorenz.gaertner@gmail.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/lorenzennio"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin-in"
      url: "https://www.linkedin.com/in/lorenz-gaertner/"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/lorenzennio"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      #url: "https://instagram.com/mmistakes"


# Site Footer
footer:
  links:
    - label: "Mail"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:lorenz.gaertner@gmail.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/lorenzennio"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin-in"
      url: "https://www.linkedin.com/in/lorenz-gaertner/"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/lorenzennio"


# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - docs
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - Rakefile
  - README
  - test
  - tmp
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Defaults
defaults:
  # _posts -- the projects listed in the index
  - scope:
      path: ""
      type: posts
    values:
      layout: project
      math: true   # several posts carry inline \( … \) LaTeX
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page


# Sass/SCSS
sass:
  style: compressed
  sourcemap: never   # nothing debugs the compiled CSS in production


# Outputting
permalink: /:categories/:title/
timezone: Europe/Rome # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins (previously gems:)
plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
